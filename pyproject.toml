[build-system]
# setuptools handles editable installs and extras used by ./lab setup.
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arail"
version = "1.0.0"
description = "Autoresearch AI Lab — a learn-by-doing AI research blueprint you can share with friends and family."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

# Base dependencies are the always-on lab surfaces: portal, routing,
# workflow memory, file ingestion, vector recall, and setup helpers.
# LanceDB is core (not tier-gated) because the KB and autoresearch loop
# are too central to ship without semantic recall — it's a small, embedded
# vector DB and the lab already uses a deterministic hash embedding (see
# arail/wiki_vectors._hash_embedding) so no heavyweight ML deps come along.
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "huggingface-hub>=0.23.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "psutil>=5.9.0",
    "markdown-it-py>=3.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "lancedb>=0.13.0",
    "faster-whisper>=1.2.0",
    # Model Forge (arail.nucleus): jsonschema validates domain configs and
    # DNA cards; numpy is the reference KD-loss/renormalization math. Both
    # are needed by the `plan` verb and the /forge viewer on minimalist,
    # so they are core, not maximus-gated.
    "numpy>=1.26",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# ── Install tiers ─────────────────────────────────────────────────────────
# Two tiers: minimalist (the default everyday lab) and maximus (the full
# bench). Upgrade any time with `./arailctl upgrade maximus`.
#
#   minimalist → Dashboard + Chat + Autoresearch + Knowledge Base + Agents
#                + LanceDB vector recall. Ships Llama AI Engineer (llama-ai-eng,
#                the only default model — built with Llama-3.2-1B-Instruct,
#                ~0.9 GB, runs on 16 GB) via Ollama. External provider
#                chat (Claude / NVIDIA / OpenRouter / HF) works here via
#                plain HTTP, no extra SDK.
#   maximus    → + Admin + Notebooks + AeroLLM deep-mode streaming +
#                official Anthropic SDK + LangChain/LangGraph + cloud
#                catalog. AirLLM stays opt-in via ARAIL_INSTALL_AIRLLM=1.
#
# Legacy `min`/`max` keys are aliases of `minimalist`/`maximus` (one-release
# back-compat shim; removed in v1.1.0).
# (LanceDB is in the base dependencies above — both tiers get vector
# recall by default. The `vector` extra below is kept as a back-compat
# alias for older docs.)
minimalist = []
maximus = [
    "jupyterlab>=4.0.0",
    "anthropic>=0.34.0",
    "langchain>=0.2.0",
    "langgraph>=0.2.0",
    "pip-audit>=2.7.0,<3",
    # Model Forge (arail.nucleus) certify/verify: ed25519 signing of the
    # legacy-5 Nucleus seal payload. Declared here (not core) because
    # signing is a maximus-only verb; minimalist `verify` prints a plain
    # "install maximus" message instead of importing this.
    "cryptography>=42",
    # NOTE: AeroLLM (the deep-mode "2nd inference") is intentionally NOT a
    # hard pip dependency here. `aerollm-api` is a cargo-built native
    # extension (crates/aerollm-api in the sibling repo), not a wheel on
    # PyPI — and the self-hosted index does not host it yet. Declaring it
    # here broke `pip install -e .[maximus]` at setup step 3/11 on Apple
    # Silicon ("could not find a version that satisfies aerollm-api").
    # It is installed out-of-band by scripts/build-aerollm.sh, invoked
    # from install_accel_deps() in setup.sh and by `./arailctl deep
    # rebuild` — source build if the sibling repo is present, release
    # wheel otherwise. That path fails gracefully (lab runs without the
    # 2nd inference). Re-add a pin here only once a real wheel is
    # published. The AeroLLMBackend in router/backends.py already raises
    # ImportError with build instructions when the extension is absent.
]

# AirLLM is now opt-in (was bundled into both tiers before v1.0.0).
# Power users on CUDA/Linux can enable it with: pip install -e ".[airllm]"
# or via setup.sh: ARAIL_INSTALL_AIRLLM=1 ./arailctl setup
airllm = ["airllm>=2.0"]

# AeroLLM as a standalone extra. Kept as a no-op marker so `pip install
# -e .[aero]` resolves cleanly; the runtime is NOT pip-installable yet
# (see the NOTE in the maximus block above). Install it with:
#     ./arailctl deep rebuild     # source build from the sibling repo
#     ./arailctl deep update      # release wheel, once one is published
# Wired into router via `src/arail/router/backends.py::AeroLLMBackend`
# (registered as "aerollm" in BACKEND_MAP).
aero = []

# Back-compat aliases — accept old `min`/`max` names for one release.
# Removed in v1.1.0. The setup script and pip install both honor these.
min = []
max = [
    "jupyterlab>=4.0.0",
    "anthropic>=0.34.0",
    "langchain>=0.2.0",
    "langgraph>=0.2.0",
    "pip-audit>=2.7.0,<3",
    # AeroLLM is installed out-of-band, not as a hard pip dep — see the
    # NOTE in the `maximus` block above.
]

security = ["pip-audit>=2.7.0,<3"]

# ── Hardware/runtime extras ───────────────────────────────────────────────
# scripts/setup.sh installs one accelerator extra based on detected hardware.
mlx   = ["mlx>=0.4.0", "mlx-lm>=0.8.0"]
cuda  = ["vllm>=0.5.0", "torch>=2.3.0"]
cpu   = ["llama-cpp-python>=0.2.0"]

# ── Granular extras (also included via max above) ─────────────────────────
notebook  = ["jupyterlab>=4.0.0"]
cloud     = ["anthropic>=0.34.0"]
# `vector` is a no-op alias kept so old install docs (`pip install -e .[vector]`)
# don't break — the package is now in the base dependency list.
vector    = ["lancedb>=0.13.0"]
langchain = ["langchain>=0.2.0", "langgraph>=0.2.0"]

# ── Dev / test ────────────────────────────────────────────────────────────
dev   = ["pytest>=7.4.0", "cryptography>=42"]

[project.urls]
Repository = "https://github.com/cdarnell/qukaizen-arail"
Issues     = "https://github.com/cdarnell/qukaizen-arail/issues"

[tool.arail]
# Configuration-as-code for the blueprint. Package versions, install sources,
# and runtime defaults read from one source of truth instead of scattering
# through shell scripts that drift over time.
default_blueprint    = "Autoresearch"
learning_goal        = "Improve something measurable and learn while the loop runs."
memory_backend       = "lancedb"
memory_fallback      = "json"
configuration_source = "pyproject.toml"

[tool.arail.tiers]
# Declarative surface matrix. portal/app.py reads this to tier-gate the nav.
minimalist = { description = "Minimalist — Dashboard, Chat, Autoresearch, Knowledge Base (with LanceDB vector recall), Agents, Docs. Ships Llama AI Engineer (built with Llama-3.2-1B-Instruct, ~0.9 GB, runs on 16 GB) as the sole default model. No deep backend by default.", surfaces = ["dashboard", "chat", "research", "knowledge", "agents", "docs"] }
maximus    = { description = "Maximus — Everything in Minimalist + Admin, Docs, Notebooks, LangChain/LangGraph, full cloud catalog. Adds AeroLLM deep mode — the heaviest model that runs well locally; cloud frontier models are one click away via Compute Source.", surfaces = ["dashboard", "chat", "research", "knowledge", "agents", "admin", "docs", "notebooks", "terminal", "tuning", "plugins"] }
# Legacy aliases — one-release compat shim, removed in v1.1.0.
min = { description = "(deprecated alias for `minimalist`)", surfaces = ["dashboard", "chat", "research", "knowledge", "agents", "docs"] }
max = { description = "(deprecated alias for `maximus`)", surfaces = ["dashboard", "chat", "research", "knowledge", "agents", "admin", "docs", "notebooks", "terminal", "tuning", "plugins"] }

[tool.arail.models]
# Two-tier persona-wrap model strategy (MODEL-TIERS-V2, 2026-05-31):
#
#   minimalist default: llama-ai-eng — Llama-3.2-1B-Instruct + AI-engineer
#     persona via Modelfile.default SYSTEM prompt. Install: ollama pull
#     llama3.2:1b → ollama create llama-ai-eng -f models/ai-eng/Modelfile.default
#     License: Llama 3.2 Community License (see NOTICE, licenses/).
#
#   maximus deep: ai-engineer — Qwen2.5-7B-Instruct + AI-engineer persona
#     via Modelfile.deep. Offered (not auto-installed) on maximus setup.
#     License: Apache-2.0.
#
# The self-hosted GGUF ladder (ai_eng_hf_repo / ai_eng_quant / ai_eng_gh_url /
# ai_eng_sha256) is DORMANT — future Nucleus-distill lane; gated behind
# ARAIL_AI_ENG_SELFHOSTED=1. The shipping default is `default_base` above.

# ── Two-tier persona-wrap defaults ────────────────────────────────────────
# Minimalist (everyday) default: Llama-3.2-1B-Instruct + AI-engineer persona
default_base          = "llama3.2:1b"
default_model_name    = "llama-ai-eng"
default_license       = "Llama-3.2-Community-License"
default_modelfile     = "models/ai-eng/Modelfile.default"

# Maximus deep persona: Qwen2.5-7B-Instruct + AI-engineer persona
deep_persona_base     = "qwen2.5:7b"
deep_persona_name     = "ai-engineer"
deep_persona_license  = "Apache-2.0"
deep_persona_modelfile = "models/ai-eng/Modelfile.deep"

# ── Self-hosted ai-eng artifact (DORMANT — future Nucleus-distill lane) ───
# DORMANT — future Nucleus-distill lane; gated behind ARAIL_AI_ENG_SELFHOSTED=1.
# The shipping default is `default_base` above (llama3.2:1b persona-wrap).
# Fill in after running scripts/build_ai_eng.sh publish and uploading the GGUF.
# Forks rebrand by overriding these env vars or editing this block.
ai_eng_hf_repo  = "qukaizen/ai-eng-1.5b-gguf"  # __PLACEHOLDER__ — set your HF org/repo
ai_eng_quant    = "Q4_K_M"                     # placeholder quant; confirm after packaging
ai_eng_gh_url   = "https://github.com/qukaizen/arail/releases/download/ai-eng-1.5b/ai-eng-1.5b-Q4_K_M.gguf"  # __PLACEHOLDER__
ai_eng_cdn_url  = ""                           # optional qukaizen.com mirror (leave empty to skip)
# sha256 of the packaged GGUF — published by build_ai_eng.sh publish.
# MUST remain __PLACEHOLDER_SHA256__ until a real digest is pinned; while it is
# a placeholder the mirror paths (GitHub/CDN) fail-closed (no ollama create
# from an unverified blob). The HF path (ollama-verified) and preview net
# are unaffected and keep setup working.
ai_eng_sha256   = "__PLACEHOLDER_SHA256__"

# Preview base: used by the last-resort fallback until the GGUF is uploaded.
# The literal model id is kept here as operator config (class-c internal ref).
ai_eng_preview  = "qwen2.5:1.5b"

# AeroLLM deep-mode runtime (Apple Silicon). Per-tier model selection:
#
#   minimalist → mlx-community/Qwen2.5-7B-Instruct-4bit  (~4 GB resident,
#                fits 16 GB Macs; selected for everyday lab use).
#   maximus    → mlx-community/Qwen2.5-7B-Instruct-4bit  (same 7B as
#                minimalist by default — "works out of the box on any
#                Apple Silicon Mac AeroLLM ships on"). Operators upgrade
#                to a frontier model after setup by downloading the
#                weights and setting AEROLLM_MODEL in .env, e.g.:
#                  hf download mlx-community/Qwen2.5-32B-Instruct-4bit \
#                    --local-dir lab/models/Qwen2.5-32B-Instruct-4bit
#                  echo 'AEROLLM_MODEL=Qwen2.5-32B-Instruct-4bit' >> .env
#                Pre-7180a8a the maximus default was Qwen2.5-72B-Instruct-4bit
#                (~40 GB resident, needs 48 GB+); that footgunned every clone
#                without prebuilt weights or sufficient RAM. Default is now a
#                proven floor; operators self-select the ceiling.
#
# CUDA hosts fall back to AirLLM with a notice until AeroLLM CUDA lands.
# Operators can override the runtime value via AEROLLM_MODEL in .env.
aerollm_maximus    = "mlx-community/Qwen2.5-7B-Instruct-4bit"
aerollm_minimalist = "mlx-community/Qwen2.5-7B-Instruct-4bit"
# Legacy alias for tooling that reads [tool.arail.models].aerollm directly.
# Points at the minimalist (7B) value — safe fallback for any caller that
# does not know about the per-tier split.
aerollm            = "mlx-community/Qwen2.5-7B-Instruct-4bit"

# ── Opt-in AirLLM deep-mode (gated behind ARAIL_INSTALL_AIRLLM=1) ─────
# DEPRECATED defaults: the 70B/405B Llama values are the wrong weight class
# for the 36 GB Apple Silicon target hardware (OOM or crawl on fresh clones).
# Operators who genuinely want AirLLM layer-streaming set AIRLLM_MODEL
# explicitly in .env. The sentinel below prevents any accidental auto-load.
#
# TODO(deep-model): set the 20–30B open deep model id here. See ARCHITECTURE
#   sprint 2026-05-30-model-hosting-reframe § Part 1. Until set, deep mode
#   shows a "configure your deep model" notice — it does NOT download anything.
airllm_minimalist = "__TODO_DEEP_MODEL__"
airllm_maximus    = "__TODO_DEEP_MODEL__"
airllm            = "__TODO_DEEP_MODEL__"

# Coder starter model (opt-in, --with-coder flag — opencode Workbench in Maximus).
# Downloaded with ./arailctl setup --with-coder. ~2 GB Q4; fits 8 GB VRAM.
coder_mlx    = "mlx-community/Qwen2.5-Coder-3B-Instruct-4bit"
coder_cuda   = "Qwen/Qwen2.5-Coder-3B-Instruct"
coder_cpu    = "Qwen/Qwen2.5-Coder-3B-Instruct-GGUF"

[tool.arail.package-sources]
# AeroLLM (the deep "2nd inference") is installed by scripts/build-aerollm.sh:
#   • DEV     — if the local sibling repo ($ARAIL_AEROLLM_REPO, default
#               ~/ProJects/qukaizen-queuellm) is present, it's built from source via cargo
#               (`./arailctl deep rebuild`) so in-progress changes flow in.
#   • RELEASE — otherwise the published wheel is pulled from the self-hosted
#               index below (`./arailctl deep update`), public PyPI as fallback.
#               Wheels are macOS-arm64-only (no Linux/CUDA build yet).
# clone ref (source builds): git+https://github.com/cdarnell/qukaizen-queuellm@main
# (repo renamed 2026-08-21, was qukaizen-aerollm; old URL still redirects.
# the "aerollm" key/value below and the dependency pin are unchanged.)
aerollm       = "aerollm-api>=1.0,<2.0"
aerollm_index = "https://pypi.qukaizen.com/simple/"
# BUNDLED — no sibling repo, no index credentials required. A checksummed
# aerollm_api.abi3.so is fetched from an ARAIL GitHub Release asset
# (`./arailctl deep install`, scripts/build-aerollm.sh bundle). The tag
# below names which ARAIL release carries the bundle asset; keep it in
# lockstep with THIRD-PARTY-LICENSES/aerollm/BUNDLE.json (see
# docs/releasing.md — a drift test enforces this).
aerollm_bundle_tag = "v1.1.0"
# sha256 of the BUNDLE TARBALL (not the .so — that digest lives in
# THIRD-PARTY-LICENSES/aerollm/BUNDLE.json's `sha256` field and is verified
# separately, against the in-tarball MANIFEST.json, after extraction). This
# is the out-of-band pin `docs/cli.md` tells security-conscious users to set
# as AEROLLM_BUNDLE_SHA256 — forwarded by setup.sh exactly like
# aerollm_bundle_tag. Bump alongside aerollm_bundle_tag (docs/releasing.md
# step 4) whenever the bundle is refreshed.
aerollm_bundle_sha256 = "57f30364738580d4a7808f9165ddfdf692eb52afaa435e491b4eda39afb63e93"
# AirLLM stays declared for opt-in power-user installs (not pulled by default).
airllm  = "airllm>=2.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arail.portal" = ["templates/*.html", "templates/wiki/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "perf: performance smoke tests (may be excluded with -m 'not perf' on slow CI)",
    "e2e: end-to-end witness tests (require a real lab process)",
    "qa: paranoid QA edge-case tests (slow; may be excluded with -m 'not qa')",
    "live_stt: tests needing real audio + a local Whisper model / afconvert; skipped in CI (run with -m live_stt)",
    "live_ocr: tests needing real Apple Vision + swiftc compile + a real image; skipped in CI (run with -m live_ocr)",
    "requires_ollama: tests needing a reachable local Ollama with the spec's embedding model pulled; auto-skipped when arail.dbspec.embed.probe() fails (FM18)",
    "requires_mlx: tests needing a real mlx/mlx-lm install and Apple Silicon; skipped in CI",
    "requires_aerollm: tests needing a real aerollm_api extension build; skipped in CI",
    "requires_kernel: tests needing a real Linux kernel + vulns clone (item 10 only); skipped in CI",
    "requires_qkz_bin: tests needing the real Nucleus Rust qkz binary (NUCLEUS_QKZ_BIN); skipped in CI",
]

