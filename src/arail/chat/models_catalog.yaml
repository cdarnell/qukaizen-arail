# ── AeroLLM minimalist-weight MoE (OLMoE-1B-7B) — BLOCKED on aerollm port ──
# Candidate small MoE for the minimalist tier (7B total / 1B active,
# Apache-2.0). NOT YET LOADABLE via AeroLLM: aerollm-backend-mlx-native's
# model_type dispatch (crates/aerollm-backend-mlx-native/src/backend.rs)
# only recognizes llama/gpt_oss/qwen3/qwen2/gemma today — "olmoe" hits the
# "unsupported model type" error path. Needs a new architecture module
# (olmoe.rs, mirroring qwen3_moe.rs: config, decoder layer, MoE block,
# arch-dispatch wiring, correctness fixture) before this is usable as an
# AEROLLM_MODEL value. Weights can be pre-downloaded; do not set
# AEROLLM_MODEL to this id until the port lands and this comment is updated.
- id: OLMoE-1B-7B-0125-Instruct-4bit
  name: OLMoE 1B-7B (MoE, pending AeroLLM port)
  family: olmoe
  size_gb: 4.0
  released: 2025-01
  source: mlx
  good_at: [chat, moe, efficient]
  description: "AllenAI OLMoE — 7B total / 1B active MoE, Apache-2.0.
               Candidate minimalist-tier MoE for AeroLLM; blocked until
               aerollm's olmoe.rs architecture module ships (see
               aerollm CLAUDE.md / MILESTONES.md for status)."
  install: "hf download mlx-community/OLMoE-1B-7B-0125-Instruct-4bit --local-dir $ARAIL_MODELS_DIR/OLMoE-1B-7B-0125-Instruct-4bit"
  hf_repo: mlx-community/OLMoE-1B-7B-0125-Instruct-4bit
  tier: optional

