# Curated catalog of SLMs the lab recommends for local inference.
#
# Total catalog footprint when fully installed: ~50 GB. Users only
# install what they need — the chat model gallery shows everything
# from this catalog with installed/available state, so they can see
# the breadth of options without committing disk.
#
# Format per entry:
#   id            ollama model id (model:tag) — also the install handle
#   name          display name
#   family        gemma | qwen | llama | phi | mistral | deepseek
#   size_gb       approximate download size
#   released      YYYY-MM (when the weights or this tag were published)
#   source        ollama | mlx | hf
#   good_at       short list, used as chips in the UI
#   description   one-line pitch
#   install       install command (shown to user; one-click in phase 2)
#   tier          recommended | optional | flagship
#   hf_repo       (source: hf|mlx only) the HuggingFace repo id, e.g.
#                 "mlx-community/Qwen2.5-7B-Instruct-4bit" — structured,
#                 not parsed out of `install`, so the boot model-selection
#                 banner can link straight to huggingface.co/<hf_repo>.
#                 Omit for ollama-sourced rows (no HF link to show).
#
# Ordering controls UI display order. Recommended models first.

# ── ARAIL's default — Llama AI Engineer (the only model that ships pre-installed) ──
# AI engineering assistant built with Llama (Llama-3.2-1B-Instruct, ~0.9 GB,
# runs on 16 GB). Installed by setup via:
#   ollama pull llama3.2:1b && ollama create llama-ai-eng -f models/ai-eng/Modelfile.default
# License: Llama 3.2 Community License (see NOTICE, licenses/).
- id: llama-ai-eng
  name: Llama AI Engineer
  family: llama
  size_gb: 0.9
  released: 2026-05
  source: ollama
  good_at: [chat, reasoning, agent, code]
  description: "AI engineering assistant — built with Llama (Llama-3.2-1B-Instruct).
               ARAIL's default local assistant: careful, production-minded,
               explains tradeoffs. ~0.9 GB, runs on 16 GB. Built with Llama."
  install: "ollama pull llama3.2:1b  # then: ollama create llama-ai-eng -f models/ai-eng/Modelfile.default"
  tier: recommended

# ── Gemma 2B generalist — the STAGED minimalist default-floor (Phase B, DORMANT) ──
# A ~2B Gemma generalist: a stronger default brain than the 1B for technical
# Worlds (physics/math). DORMANT until G1 (weights + models/ai-eng/Modelfile.gemma
# from the qukaizen-ddac / Gemma POC session) and G2 ("Built with Gemma" disclosure
# — see sprints/2026-06-14-world-model-hint/handoff/gemma-disclosure-checklist.md).
# Listed as `optional` until armed; the setup.sh ARAIL_DEFAULT_GEMMA=1 path is a
# no-op until the real Modelfile.gemma (no __PLACEHOLDER__) exists. When armed:
# flip tier → recommended and update the install handle.
- id: qkz-project-aware-2b
  name: Gemma 2B Generalist (staged default)
  family: gemma
  size_gb: 1.6
  released: 2026-06
  source: ollama
  good_at: [chat, reasoning, physics, math, code]
  description: "Project-aware ~2B generalist — built with Gemma. STAGED to become
               the minimalist default brain (a stronger floor than the 1B for
               technical Worlds). DORMANT until its weights + the 'Built with
               Gemma' disclosure land. Built with Gemma."
  install: "# Phase B (dormant): ollama create qkz-project-aware-2b -f models/ai-eng/Modelfile.gemma  (needs the real Gemma base — see handoff/)"
  tier: optional

# ── Maximus deep AI engineer (7B, Qwen2.5-7B-Instruct, Apache-2.0) ──
# The deep persona for maximus tier. Offered on maximus setup; not auto-installed.
