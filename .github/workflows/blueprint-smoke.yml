name: Blueprint Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: blueprint-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  import-routes:
    name: Import and route guardrail
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # pyproject pins `dac_world` to the PRIVATE qukaizen-dac repo over SSH,
      # so pip must be able to `git clone` it. Requires the DAC_DEPLOY_KEY repo
      # secret (a read-only deploy key on cdarnell/qukaizen-dac).
      - name: Authenticate to private dac_world repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DAC_DEPLOY_KEY }}

      # Retry: the `dac_world` dependency is a private git+ssh requirement, and
      # pip clones it with `--filter=blob:none`. A blobless clone needs a SECOND
      # authenticated fetch at checkout time, so any GitHub SSH/codeload
      # flakiness surfaces as:
      #   "Clone succeeded, but checkout failed"
      #   "could not fetch <sha> from promisor remote"
      #   "git@github.com: Permission denied (publickey)"
      # even though the credential is valid. Retry with backoff rather than
      # failing a whole run on a transient.
      - name: Install dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if python -m pip install -e ".[dev]"; then
              exit 0
            fi
            echo "::warning::dependency install attempt ${attempt}/3 failed (likely the private dac_world clone); retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::error::dependency install failed after 3 attempts"
          exit 1

      - name: Run import smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_imports.py -q

  golden-path-ubuntu:
    name: Golden path smoke (Ubuntu)
    runs-on: ubuntu-latest
    needs: import-routes
    timeout-minutes: 20
    env:
      ARAIL_NONINTERACTIVE: "1"
      ARAIL_SKIP_OLLAMA: "1"
      # Belt-and-suspenders: min-tier setup already skips the deep backend.
      # AIRLLM is today's deep package; AEROLLM kept for the eventual swap-back.
      ARAIL_SKIP_AIRLLM: "1"
      ARAIL_SKIP_AEROLLM: "1"
      ARAIL_NO_BROWSER: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # `./arailctl setup` pip-installs the package, which pulls the private
      # dac_world dependency over SSH — same key requirement as the job above.
      - name: Authenticate to private dac_world repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DAC_DEPLOY_KEY }}

      # `./arailctl setup` pip-installs the package itself, which pulls the
      # private dac_world dep through the same fragile blobless-clone path (see
      # the import-routes job). Pre-install it here WITH RETRIES so setup's own
      # install is an already-satisfied no-op and a transient SSH failure can't
      # take down the whole golden path.
      - name: Pre-install dependencies (retried)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if python -m pip install -e ".[dev]"; then
              exit 0
            fi
            echo "::warning::dependency install attempt ${attempt}/3 failed (likely the private dac_world clone); retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::error::dependency install failed after 3 attempts"
          exit 1

      - name: Create artifact directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/http

      - name: Run non-interactive setup
        shell: bash
        run: |
          set -euo pipefail
          ./arailctl setup > ci-artifacts/setup.stdout 2> ci-artifacts/setup.stderr

      - name: Redact setup logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          secret = None
          env_file = Path('.env')
          if env_file.exists():
              for line in env_file.read_text().splitlines():
                  if line.startswith('ARAIL_PASSWORD='):
                      secret = line.split('=', 1)[1]
                      print(f'::add-mask::{secret}')
                      break

          for rel_path in (
              'ci-artifacts/setup.stdout',
              'ci-artifacts/setup.stderr',
              'ci-artifacts/doctor.log',
              'ci-artifacts/start.log',
          ):
              path = Path(rel_path)
              if not path.exists():
                  continue
              text = path.read_text(errors='replace')
              if secret:
                  text = text.replace(secret, '[REDACTED]')
              path.write_text(text)
          PY

      - name: Verify generated config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read_kv(path: str) -> dict[str, str]:
              values: dict[str, str] = {}
              for line in Path(path).read_text().splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith('#') or '=' not in stripped:
                      continue
                  key, value = stripped.split('=', 1)
                  values[key] = value
              return values

          env = read_kv('.env')
          conf = read_kv('lab.conf')

          required = ['MODEL_BACKEND', 'ARAIL_PASSWORD', 'OPEN_NOTEBOOK_ENCRYPTION_KEY', 'LAB_NAME']
          missing = [key for key in required if not env.get(key)]
          if missing:
              raise SystemExit(f'missing required .env keys: {missing}')

          if conf.get('IDE_PASSWORD') != env.get('ARAIL_PASSWORD'):
              raise SystemExit('lab.conf IDE_PASSWORD is not synchronized with .env ARAIL_PASSWORD')

          if env.get('OPEN_NOTEBOOK_ENCRYPTION_KEY') != env.get('ARAIL_PASSWORD'):
              raise SystemExit('OPEN_NOTEBOOK_ENCRYPTION_KEY is not synchronized with ARAIL_PASSWORD')

          print('generated config is synchronized')
          PY

      - name: Run doctor
        shell: bash
        run: |
          set -euo pipefail
          # ARCHITECTURE.md §10 (operator ruling, PR #181 CI, "fix 2"): this
          # golden-path lab ships 8 seed PKB pages tracked in git, so this
          # checkout is ALWAYS in the QA-6 condition — content exists,
          # nothing has been approved — and `doctor` CORRECTLY reports
          # `kb_gate` as a required, degraded finding (exit 3) for that
          # genuinely-un-approved corpus. Of the three ways to make this
          # step exit 0: approving the seed content in CI would be CI
          # fabricating consent (ruled out — the architect named it
          # explicitly, and the 2026-08-09 compiled-kb-bootstrap sprint
          # forbids automatic approval outright); deleting the seed content
          # would destroy a fixture other assertions may depend on. The
          # operator chose the third: stop requiring exit 0 here. DO NOT
          # "fix" this by approving something in this step — that is
          # exactly the policy violation this comment exists to prevent.
          #
          # What still fails the step: doctor's documented exit-code
          # contract (arailctl's own `doctor` case, ARCHITECTURE.md
          # §12/§13) is 0 healthy / 1 broken (no .venv, an import failure,
          # a required binary missing) / 2 bad flag / 3 degraded. Only 0
          # and 3 are accepted here as "doctor ran and reported honestly."
          # 1, 2, or anything else (a crash, a signal, no output at all)
          # still fails the build — no bare `|| true`, which would let a
          # genuine crash pass silently and would be this sprint's own
          # "declared but never instantiated, and nobody's watching"
          # defect class one more time, just moved into CI wiring.
          doctor_rc=0
          ./arailctl doctor > ci-artifacts/doctor.log 2>&1 || doctor_rc=$?
          echo "doctor exited ${doctor_rc}"
          if [[ ! -s ci-artifacts/doctor.log ]]; then
            echo "::error::doctor produced no report at all (ci-artifacts/doctor.log is empty)"
            exit 1
          fi
          case "$doctor_rc" in
            0)
              echo "doctor: healthy"
              ;;
            3)
              echo "::warning::doctor exited 3 (degraded) — expected on this golden path (unapproved seed PKB content, kb_gate); see ci-artifacts/doctor.log"
              ;;
            *)
              echo "::error::doctor exited ${doctor_rc} (only 0 or 3 are accepted here) — see ci-artifacts/doctor.log"
              exit "$doctor_rc"
              ;;
          esac

      - name: Start lab services
        shell: bash
        run: |
          set -euo pipefail
          # Concurrent Worlds (sprints/2026-07-28-concurrent-worlds/) made bare
          # `arailctl start` require an explicit --world whenever more than one
          # World is catalogued under lab/worlds/ and stdin isn't a TTY — this
          # checkout ships several (ai, qukaizen, video-games), so the old bare
          # invocation now exits 2 with a picker prompt instead of starting
          # anything. Pin an explicit World and the health-check's hardcoded
          # port so this golden-path smoke test keeps checking the base app,
          # not a specific World's own content.
          ./arailctl start --world ai --port 8080 > ci-artifacts/start.log 2>&1 &
          echo $! > ci-artifacts/start.pid

      - name: Wait for local health surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          # Concurrent Worlds (sprints/2026-07-28-concurrent-worlds/) gives
          # each World instance its own dynamically-allocated memory-service
          # port: `inst_allocate_ports` in scripts/lib/instances.sh computes
          # it as PORTAL_PORT + INST_PORT_LANCE_OFFSET(4) - INST_PORT_PORTAL_OFFSET(0)
          # when a --port override is given (as this job does, --port 8080),
          # so LANCE_PORT lands on 8084, not the fixed default 7414. Read the
          # instance's actual pinned pack (lab/instances/ai/instance.env)
          # instead of hardcoding.
          #
          # `./arailctl start` was backgrounded (`&`) by the previous step,
          # which returns as soon as the process is forked -- the instance
          # pack file doesn't exist yet at that instant, only once start.sh
          # reaches "[4/8] Instance root". A one-shot read here raced that
          # and silently fell back to 7414 every time. Re-resolve it lazily
          # on every loop iteration until found, so it doesn't matter when
          # the pack file actually lands.
          pack_file = Path('lab/instances/ai/instance.env')
          lance_port = None

          def _resolve_lance_port() -> int:
              global lance_port
              if lance_port is not None:
                  return lance_port
              if pack_file.exists():
                  for line in pack_file.read_text().splitlines():
                      if line.startswith('LANCE_PORT='):
                          lance_port = int(line.split('=', 1)[1].strip().strip('"'))
                          return lance_port
              return 7414  # fallback while the pack file hasn't landed yet

          # Portal auth (sprints/2026-10-25-buddy-s4-gateway-in-box, ARAIL D3, #205):
          # every portal route needs a credential except a short anonymous list --
          # /login, /static/, /health, /healthz, /api/system/health, /api/instance. A
          # program presents the per-instance bearer in <ARAIL_DATA_DIR>/portal.token,
          # which the portal's own startup hook mints for an onboarded lab
          # (`./arailctl auth token` prints its id and path, never its value). This
          # script predated that and sent no credential, so from #205 on `/api/jobs/state`
          # answered 401 for the whole window below -- and because urllib's HTTPError is an
          # OSError, the loop below retried that deterministic refusal for ten minutes.
          #
          # Like the lance port, the token is read lazily: the file exists once the
          # portal is up, not before. It is sent ONLY to the portal's protected routes --
          # never to the anonymous probes (that they stay anonymous is part of what this
          # checks; the SRE watcher depends on /api/system/health) and never to the
          # memory service (another listener, with no use for it). It is masked in this
          # log, scrubbed from the diagnostics dump, and never printed.
          default_data_dir = Path('lab/instances/ai/data')
          token_file = default_data_dir / 'portal.token'
          token = None
          PROTECTED = {'dashboard-root', 'jobs-state'}

          def _resolve_token() -> str | None:
              global token, token_file
              if token is not None:
                  return token
              # The pack's own ARAIL_DATA_DIR first (bare, or single/double quoted when the path needs it),
              # then the layout `inst_data_dir` builds, which is where CI's portal.token has been seen.
              data_dirs = [default_data_dir]
              if pack_file.exists():
                  for line in pack_file.read_text().splitlines():
                      if line.startswith('ARAIL_DATA_DIR='):
                          data_dirs.insert(0, Path(line.split('=', 1)[1].strip().strip('"\'')))
                          break
              token_file = data_dirs[0] / 'portal.token'  # named in messages if no candidate has one
              for data_dir in data_dirs:
                  if (data_dir / 'portal.token').exists():
                      token_file = data_dir / 'portal.token'
                      value = token_file.read_text().strip()
                      if value:
                          token = value
                          print(f'::add-mask::{token}')
                      break
              return token

          def _token_id() -> str:
              return hashlib.sha256(token.encode('utf-8')).hexdigest()[:8] if token else '-'  # what `auth token` prints

          class _Refused(Exception):
              """The portal refused a request that carried the bearer: a verdict, not a boot race."""

          def _get(name: str, url: str) -> str:
              headers = {}
              if name in PROTECTED and _resolve_token():
                  headers['Authorization'] = f'Bearer {token}'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=5) as response:
                      body = response.read().decode('utf-8', 'replace')
                      if response.status != 200:
                          raise RuntimeError(f'{name} returned HTTP {response.status}')
                      final_path = urllib.parse.urlparse(response.geturl()).path
              except urllib.error.HTTPError as exc:
                  if exc.code in (401, 403) and headers:
                      try:
                          why = json.loads(exc.read().decode('utf-8', 'replace')).get('error', '?')
                      except (ValueError, AttributeError):
                          why = '?'
                      raise _Refused(
                          f'{name}: HTTP {exc.code} ({why}) to the bearer with id {_token_id()} read from {token_file}'
                      ) from None
                  raise  # 401 with no bearer yet, 5xx, ...: still booting, the loop retries
              if name == 'dashboard-root' and final_path.startswith('/login'):
                  # An unauthenticated GET / is a 302 to the login page, which urllib follows to a
                  # 200: without this the dashboard check would pass on the login form.
                  if headers:
                      raise _Refused(f'{name}: sent to {final_path} although the bearer with id {_token_id()} was presented')
                  raise urllib.error.URLError(f'{name} is still the login page: no portal.token yet')
              return body

          def _endpoints() -> dict[str, str]:
              return {
                  'dashboard-root': 'http://127.0.0.1:8080/',
                  'jobs-state': 'http://127.0.0.1:8080/api/jobs/state',
                  'system-health': 'http://127.0.0.1:8080/api/system/health',
                  'memory-health': f'http://127.0.0.1:{_resolve_lance_port()}/health',
              }

          # 120s, then 300s, then 600s all failed with "connection refused"
          # for the ENTIRE window -- and critically, the two most recent
          # runs' portal.log tails were byte-for-byte IDENTICAL despite one
          # waiting twice as long as the other: both stop dead at "No
          # existing dataset ... it will be created" for the same two
          # LanceDB tables (agent_workflows.lance, pkb_pages.lance), with
          # zero further log lines either time. If this were merely slow,
          # doubling the wait should show SOME additional progress. It
          # didn't -- which points at a hang, not a cold-start cost, and no
          # amount of waiting fixes a genuine hang. Widening the deadline
          # again would just burn another CI cycle re-confirming that.
          #
          # Kept 600s as a ceiling (still well inside the job's 20-minute
          # budget) but stopped trying to fix this by guessing timeouts.
          # Instead: log a lightweight timeline every 15s -- a raw TCP
          # connect probe to the portal port, plus portal.log's current
          # byte length -- to ci-artifacts/timeline.txt. That directly
          # answers the open question (does portal.log ever grow at all
          # during the wait, and exactly when -- if ever -- does the port
          # become connectable) instead of inferring it from a single
          # end-of-run snapshot.
          import socket

          def _port_open(port: int) -> bool:
              try:
                  with socket.create_connection(('127.0.0.1', port), timeout=1):
                      return True
              except OSError:
                  return False

          def _portal_log_size() -> int:
              for p in Path('lab/instances').glob('*/log/portal.log'):
                  try:
                      return p.stat().st_size
                  except OSError:
                      pass
              return -1

          timeline = Path('ci-artifacts/timeline.txt')
          timeline.parent.mkdir(parents=True, exist_ok=True)
          timeline_fh = timeline.open('a')
          start_time = time.time()
          last_timeline_at = 0.0

          deadline = time.time() + 600
          last_error: str | None = None
          refused: str | None = None
          responses: dict[str, str] = {}

          while time.time() < deadline:
              if time.time() - last_timeline_at >= 15:
                  last_timeline_at = time.time()
                  elapsed = round(time.time() - start_time, 1)
                  probe_port = _resolve_lance_port()
                  line = (
                      f'{elapsed}s  8080_open={_port_open(8080)}  '
                      f'{probe_port}_open={_port_open(probe_port)}  '
                      f'portal.log_bytes={_portal_log_size()}\n'
                  )
                  timeline_fh.write(line)
                  timeline_fh.flush()
              try:
                  current: dict[str, str] = {}
                  for name, url in _endpoints().items():
                      current[name] = _get(name, url)

                  jobs_state = json.loads(current['jobs-state'])
                  system_health = json.loads(current['system-health'])
                  memory_health = json.loads(current['memory-health'])

                  if not isinstance(jobs_state, dict):
                      raise RuntimeError('jobs-state did not return a JSON object')
                  if not isinstance(system_health, dict):
                      raise RuntimeError('system-health did not return a JSON object')
                  if memory_health.get('status') != 'ok':
                      raise RuntimeError(f"memory-health status was {memory_health.get('status')!r}")

                  responses = current
                  break
              except _Refused as exc:
                  # Waiting longer cannot change a refusal. Expire the deadline so this falls
                  # straight into the failure path below, the same diagnostics dump a timeout gets.
                  refused = str(exc)
                  deadline = 0.0
              except (OSError, ValueError, urllib.error.URLError) as exc:
                  last_error = str(exc)
                  time.sleep(2)
          else:
              # Two straight timeout bumps (120s, then 300s) failed the exact
              # same way -- "connection refused" for the ENTIRE window, never
              # a single transient success -- while the backgrounded
              # ./arailctl start process's own log later showed a complete,
              # successful boot (all 8 stages, including an internal
              # token-matched readiness probe on this same port). That
              # combination means guessing a third timeout number is the
              # wrong move: something about *this* runner's state at failure
              # time needs to be captured directly, not inferred after the
              # fact from a log the launcher writes to a redacted artifact.
              import subprocess

              # `::add-mask::` (Redact setup logs, earlier in this job) only
              # scrubs the VIEWABLE workflow log -- it does nothing for a raw
              # file written to disk and uploaded as an artifact, which is
              # exactly what this diagnostics dump is. Redact independently,
              # the same way the existing step does for
              # setup.stdout/stderr/doctor.log/start.log.
              secret = None
              env_file = Path('.env')
              if env_file.exists():
                  for line in env_file.read_text().splitlines():
                      if line.startswith('ARAIL_PASSWORD='):
                          secret = line.split('=', 1)[1]
                          break

              diag = Path('ci-artifacts/diagnostics.txt')
              diag.parent.mkdir(parents=True, exist_ok=True)
              with diag.open('w') as f:
                  for label, cmd in (
                      ('ps aux', ['ps', 'aux']),
                      ('ss -tlnp (listening sockets)', ['ss', '-tlnp']),
                      ('start.pid + is it alive', ['bash', '-c', 'p=$(cat ci-artifacts/start.pid 2>/dev/null); echo "pid=$p"; kill -0 "$p" 2>&1 && echo alive || echo dead']),
                      ('lab/instances tree', ['find', 'lab/instances', '-maxdepth', '4']),
                      ('portal.token (mode and owner only)', ['bash', '-c', 'ls -l lab/instances/*/data/portal.token 2>&1']),
                      ('portal.log (tail)', ['bash', '-c', 'tail -n 80 lab/instances/*/log/portal.log 2>&1']),
                      ('memory.log (tail)', ['bash', '-c', 'tail -n 40 lab/instances/*/log/memory.log 2>&1']),
                  ):
                      f.write(f'\n===== {label} =====\n')
                      try:
                          out = subprocess.run(cmd, capture_output=True, text=True, timeout=15)
                          text = out.stdout + out.stderr
                      except Exception as diag_exc:  # noqa: BLE001
                          text = f'(diagnostic command failed: {diag_exc})\n'
                      for scrub in (secret, token):
                          if scrub:
                              text = text.replace(scrub, '[REDACTED]')
                      f.write(text)
              if refused:
                  raise SystemExit(f'health check refused: {refused} -- see ci-artifacts/diagnostics.txt')
              no_token = '' if token else f' (no portal.token ever appeared at {token_file})'
              raise SystemExit(f'health checks timed out: {last_error}{no_token} -- see ci-artifacts/diagnostics.txt')

          # The bearer above only proves something if auth is actually ON. The same protected
          # route, with no credential at all, must be refused; a portal that answers it 200 has
          # default-deny off, and every green check above would be vacuous.
          try:
              with urllib.request.urlopen(_endpoints()['jobs-state'], timeout=5):
                  anonymous_status = 200
          except urllib.error.HTTPError as exc:
              anonymous_status = exc.code
          if anonymous_status != 401:
              raise SystemExit(
                  f'auth is not enforced: GET /api/jobs/state with no credential answered HTTP {anonymous_status}, '
                  'expected 401'
              )

          # ci-artifacts/ is uploaded, so make sure no response body carries the bearer before writing any.
          if token and any(token in body for body in responses.values()):
              raise SystemExit('a portal response body contains the bearer token; not writing ci-artifacts/http')

          output_dir = Path('ci-artifacts/http')
          output_dir.mkdir(parents=True, exist_ok=True)
          for name, body in responses.items():
              suffix = 'html' if name == 'dashboard-root' else 'json'
              (output_dir / f'{name}.{suffix}').write_text(body)

          print('local health surfaces responded successfully')
          print('  dashboard-root  200 bearer     the dashboard renders for a program holding portal.token (not the login page)')
          print('  jobs-state      200 bearer     a protected API answers when the bearer is presented')
          print('  system-health   200 anonymous  the health probe stays anonymous; the SRE watcher and orchestrators rely on it')
          print('  memory-health   200 anonymous  the memory service (a separate listener) is up')
          print('  auth enforced   401 no cred    the protected API refuses a request that carries no credential')
          print(f'  bearer: token id {_token_id()} (the id only), read from {token_file}')
          PY

      - name: Stop lab services
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ./arailctl stop || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-smoke-ubuntu-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: ignore

  # Follow-up lane: add a self-hosted Apple Silicon runner for the README's
  # blessed MLX path. Keep it separate from the GitHub-hosted Ubuntu gate so
  # PR feedback stays fast while the higher-fidelity hardware lane matures.