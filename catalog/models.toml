# ARAIL model catalog — universe of models the lab knows about,
# with honest per-engine compatibility status.
#
# Blueprints reference catalog entries by id (e.g.,
# `runtime.models.mlx = "qwen3_8b_4bit_mlx"`). `arail blueprint
# apply` validates references and warns when a model's status is
# `planned` for the chosen engine.
#
# Status legend (per engine):
#   supported            — runs today
#   planned              — port in progress; tracked in the engine's roadmap
#   unverified           — believed-compatible but not exercised
#   not-applicable       — engine doesn't address this format/arch
#
# Lab tiers (rough memory budgets, bf16 unless noted):
#   tiny      ≤ 2 GB resident  — laptop-friendly
#   small     ≤ 8 GB resident  — 16 GB Mac with headroom
#   medium    ≤ 16 GB resident — Mac Studio / M-series Pro
#   large     16–64 GB         — Mac Studio Ultra or NVMe streaming
#   frontier  ≥ 64 GB          — NVMe streaming required
#
# Compatibility note: AirLLM goes through HuggingFace Transformers
# and runs nearly any HF-published architecture. AeroLLM today
# implements one architecture (Qwen2 dense via mlx-native);
# Phases 3 and 4 expand AeroLLM to Llama 3.x, Mistral, and the
# MoE families. See the AeroLLM repo's MILESTONES.md.

